<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Lean Bulk Studio</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #070b0f;
        color: #cbd5e1;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        text-align: center;
        padding: 2.25rem 1.75rem;
        border: 1px solid rgba(71, 112, 156, 0.35);
        border-radius: 1.25rem;
        background: linear-gradient(180deg, rgba(71, 112, 156, 0.12), rgba(7, 11, 15, 0));
      }
      .badge {
        width: 3.5rem; height: 3.5rem;
        margin: 0 auto 1.1rem;
        display: grid; place-items: center;
        border-radius: 1rem;
        border: 1px solid rgba(71, 112, 156, 0.4);
        background: rgba(71, 112, 156, 0.15);
      }
      h1 { font-size: 1.15rem; color: #e2e8f0; letter-spacing: -0.01em; }
      p { margin-top: 0.6rem; font-size: 0.85rem; line-height: 1.65; color: #94a3b8; }
      button {
        margin-top: 1.5rem;
        min-height: 44px;
        padding: 0.7rem 1.4rem;
        border: 0; border-radius: 0.75rem;
        background: #22e78d;
        color: #06281a;
        font-weight: 700; font-size: 0.875rem;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      .safe { margin-top: 1.4rem; font-size: 0.72rem; color: #64748b; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5v11M17.5 6.5v11M3 8.5v7M21 8.5v7M6.5 12h11" />
        </svg>
      </div>
      <h1>You&rsquo;re offline</h1>
      <p>
        Lean Bulk Studio couldn&rsquo;t reach the network. If you&rsquo;ve opened
        the app before, close this tab and reopen it — the saved app will load
        from your device and all your logged workouts stay safe.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="safe">Your data is stored locally on this device.</p>
    </main>
  </body>
</html>
